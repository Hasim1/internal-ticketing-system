# Alembic configuration for the Internal Ticketing & Support Management System.
#
# The database URL is NOT hardcoded here; it is resolved at runtime from
# application settings (see alembic/env.py), which read DATABASE_URL from the
# environment / .env file.

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names; prefixes with a UTC date.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use os.pathsep-separated paths; "." adds the backend root so "app" imports.
prepend_sys_path = .

# Treat naive timestamps in migration filenames as UTC.
timezone = UTC

# Max length of the slug derived from the revision message.
truncate_slug_length = 40

# sqlalchemy.url is intentionally left blank — env.py injects it from settings.
sqlalchemy.url =


[post_write_hooks]
# No post-write hooks configured by default.


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
